<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manage Products - Baruchazon Admin</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="project.css">
  <style>
    body {
      background-color: #f5f5f5;
      font-family: 'Poppins', sans-serif;
      padding-top: 70px;
    }

    .container {
      max-width: 1100px;
    }

    .admin-header {
      background: linear-gradient(rgba(11,26,51,0.8), rgba(11,26,51,0.8)), url('admin-hero.jpg') center/cover no-repeat;
      color: white;
      padding: 60px 30px;
      text-align: center;
      border-radius: 8px;
      margin-bottom: 30px;
      animation: fadeInDown 1s ease-out;
    }

    .product-card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      padding: 20px;
      margin-bottom: 30px;
      transition: transform 0.2s;
    }

    .product-card:hover {
      transform: translateY(-5px);
    }

    .product-header {
      font-size: 18px;
      font-weight: 600;
      color: #0b1a33;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-danger, .btn-primary {
      font-size: 14px;
      padding: 6px 12px;
      border-radius: 20px;
    }

    footer {
      background-color: #0b1a33;
      color: white;
      text-align: center;
      padding: 15px 0;
      margin-top: 40px;
      font-size: 14px;
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
          <div class="collapse navbar-collapse" id="adminNav">
            <ul class="navbar-nav ml-auto">
              <li class="nav-item"><a class="nav-link" href="admin-product.html">Products Management</a></li>
              <li class="nav-item"><a class="nav-link" href="admin.html">Order Dashboard</a></li>
            </ul>
          </div>
        </div>
      </nav>
<div class="container">
  <div class="admin-header">
    <h1>Admin Product Management</h1>
    <p>Add, edit, and manage your store's products here!</p>
  </div>

  <div class="d-flex justify-content-between mb-3">
    <div>
      <button class="btn btn-primary" onclick="openNewProductModal()">➕ Add Product</button>
      <button class="btn btn-danger" onclick="bulkDelete()">🗑️ Bulk Delete Selected</button>
    </div>
    <select id="sort-products" class="form-control w-25" onchange="sortProducts()">
      <option value="default">Sort Products</option>
      <option value="price-asc">Price: Low to High</option>
      <option value="price-desc">Price: High to Low</option>
      <option value="rating-desc">Rating: High to Low</option>
    </select>
  </div>

  <div id="loading" class="text-center">
    <div class="spinner-border text-primary" role="status">
      <span class="sr-only">Loading...</span>
    </div>
  </div>

  <div id="product-list"></div>
</div>

<footer>
  <p>&copy; 2025 Baruchazon Admin</p>
</footer>

<div class="modal fade" id="productModal" tabindex="-1" role="dialog">
  <div class="modal-dialog" role="document">
    <form id="product-form" class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Product Details</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span>&times;</span></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="product-id">
        <div class="form-group">
          <label>Name</label>
          <input type="text" id="product-name" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="product-description" class="form-control" required></textarea>
        </div>
        <div class="form-group">
          <label>Price</label>
          <input type="number" id="product-price" class="form-control" required min="0" step="0.01">
        </div>
        <div class="form-group">
          <label>Rating (1-5)</label>
          <input type="number" id="product-rating" class="form-control" required min="1" max="5" step="0.1">
        </div>
        <div class="form-group">
          <label>Image URL</label>
          <input type="text" id="product-image" class="form-control" required>
        </div>
      </div>
      <div class="modal-footer">
        <button type="submit" class="btn btn-primary">Save Product</button>
      </div>
    </form>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>

<script>
let allProducts = [];

function openNewProductModal() {
  document.getElementById('product-form').reset();
  document.getElementById('product-id').value = '';
  $('#productModal').modal('show');
}

function openEditProductModal(product) {
  document.getElementById('product-id').value = product.id;
  document.getElementById('product-name').value = product.name;
  document.getElementById('product-description').value = product.description;
  document.getElementById('product-price').value = product.price;
  document.getElementById('product-rating').value = product.rating;
  document.getElementById('product-image').value = product.image_url;
  $('#productModal').modal('show');
}

function deleteProduct(id) {
  if (confirm('Are you sure you want to delete this product?')) {
    fetch(`http://baruchazon.vercel.app:3000/api/products/${id}`, { method: 'DELETE' })
    .then(() => {
      alert('SUCCESS - Product deleted');
      loadProducts();
    })
    .catch(() => alert('Delete FAILED'));
  }
}

function bulkDelete() {
  const selected = Array.from(document.querySelectorAll('.bulk-delete-checkbox:checked')).map(cb => cb.value);
  if (selected.length === 0) {
    alert('No products selected.');
    return;
  }
  if (confirm(`Delete ${selected.length} products?`)) {
    Promise.all(selected.map(id =>
      fetch(`http://baruchazon.vercel.app:3000/api/products/${id}`, { method: 'DELETE' })
    ))
    .then(() => {
      alert('SUCCESS - Products deleted');
      loadProducts();
    })
    .catch(() => alert('FAILED - Error deleting some products'));
  }
}

function sortProducts() {
  const sortType = document.getElementById('sort-products').value;
  let sorted = [...allProducts];

  if (sortType === 'price-asc') {
    sorted.sort((a, b) => a.price - b.price);
  } else if (sortType === 'price-desc') {
    sorted.sort((a, b) => b.price - a.price);
  } else if (sortType === 'rating-desc') {
    sorted.sort((a, b) => b.rating - a.rating);
  }

  renderProducts(sorted);
}

function renderProducts(products) {
  const container = document.getElementById('product-list');
  container.innerHTML = '';

  products.forEach(product => {
    const card = document.createElement('div');
    card.className = 'product-card';
    card.innerHTML = `
      <div class="product-header">
        <input type="checkbox" class="bulk-delete-checkbox" value="${product.id}">
        ${product.name} - $${parseFloat(product.price).toLocaleString('en-US', { minimumFractionDigits: 2 })}
        <div class="btn-group-sm">
          <button class="btn btn-primary btn-sm" onclick='openEditProductModal(${JSON.stringify(product)})'>Edit</button>
          <button class="btn btn-danger btn-sm" onclick="deleteProduct(${product.id})">Delete</button>
        </div>
      </div>
      <p><strong>Description:</strong> ${product.description}</p>
      <p><strong>Rating:</strong> ${product.rating} ⭐</p>
      <img src="${product.image_url}" alt="${product.name}" class="img-fluid" style="border-radius:8px; margin-top:10px; max-height:200px; object-fit:cover;">
    `;
    container.appendChild(card);
  });
}

function loadProducts() {
  fetch('http://baruchazon.vercel.app:3000/api/products')
    .then(res => res.json())
    .then(data => {
      document.getElementById('loading').style.display = 'none';
      allProducts = data;
      renderProducts(allProducts);
    })
    .catch(err => {
      console.error(err);
      document.getElementById('loading').innerHTML = '<p class="text-danger">FAILED - Failed to load products.</p>';
    });
}

document.getElementById('product-form').addEventListener('submit', function(event) {
  event.preventDefault();
  const id = document.getElementById('product-id').value;
  const name = document.getElementById('product-name').value;
  const description = document.getElementById('product-description').value;
  const price = parseFloat(document.getElementById('product-price').value);
  const rating = parseFloat(document.getElementById('product-rating').value);
  const image_url = document.getElementById('product-image').value;

  const payload = { name, description, price, rating, image_url };
  const method = id ? 'PUT' : 'POST';
  const url = id ? `http://baruchazon.vercel.app:3000/api/products/${id}` : 'http://baruchazon.vercel.app:3000/api/products';

  fetch(url, {
    method: method,
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  })
  .then(res => {
    if (!res.ok) throw new Error('Save failed');
    $('#productModal').modal('hide');
    alert('SUCCESS - Product saved');
    loadProducts();
  })
  .catch(err => alert('FAILED - Failed to save product'));
});

// Start!
loadProducts();
</script>

</body>
</html>
