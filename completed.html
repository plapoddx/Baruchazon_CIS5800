<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Order Confirmation - Baruchazon</title>
  <link rel="stylesheet" href="project.css">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f0f4f8;
      padding: 60px 20px;
    }

    .receipt-container {
      max-width: 700px;
      margin: auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      padding: 50px 40px;
      text-align: center;
      animation: slideUp 0.6s ease-out;
    }

    .check-icon {
      font-size: 60px;
      color: #28a745;
      margin-bottom: 20px;
    }

    h1 {
      color: #0b1a33;
      font-weight: 700;
      font-size: 28px;
      margin-bottom: 15px;
    }

    p {
      font-size: 18px;
      margin-bottom: 12px;
      color: #333;
    }

    .highlight {
      font-weight: 600;
      color: #0b1a33;
    }

    .btn-home, .btn-cancel {
      margin-top: 20px;
      padding: 12px 28px;
      font-size: 16px;
      border-radius: 30px;
    }

    .btn-cancel {
      background-color: #ff4d4d;
      border: none;
      color: white;
      margin-left: 10px;
    }

    .btn-cancel:hover {
      background-color: #e60000;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="receipt-container">
  <h1>Thank You for Your Purchase, <strong id="customerName"></strong>!</h1>
  <p id="customer-name"></p>
  <p class="text-center">Your order <strong id="orderId"></strong> will arrive by <span id="deliveryDate"></span>.</p>
  <div class="summary">
    <p><strong>Shipping Method:</strong> <span id="shippingMethod"></span></p>
    <p><strong>Shipping Cost:</strong> $<span id="shippingCost"></span></p>
    <p><strong>Tax:</strong> $<span id="tax"></span></p>
    <p><strong>Total:</strong> $<span id="total"></span></p>
  </div>

  <div class="mt-4">
    <a href="index.html" class="btn btn-primary btn-home">Continue Shopping</a>
    <button onclick="cancelOrder()" class="btn btn-cancel">Cancel Order</button>
  </div>
</div>

<script>
  const order = JSON.parse(localStorage.getItem('orderDetails'));
  const cart = JSON.parse(localStorage.getItem('cartSnapshot')) || [];

  if (order) {
    document.getElementById('customerName').textContent = order.firstName + ' ' + order.lastName;
    document.getElementById('orderId').textContent = order.confirmationNumber;
    document.getElementById('deliveryDate').textContent = order.deliveryDate;
    document.getElementById('shippingMethod').textContent = order.shippingMethod;
    document.getElementById('shippingCost').textContent = order.shippingCost;
    document.getElementById('tax').textContent = order.tax;
    document.getElementById('total').textContent = order.total;
  }

  function cancelOrder() {
  if (confirm('Are you sure you want to cancel this order?')) {
    const confirmationNumber = order.confirmationNumber.replace('BZ-', '');

    fetch(`https://api-baruchazon-server.onrender.com/api/orders/${confirmationNumber}/status`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: 'Cancelled' }) 
    })
      .then(res => {
        if (!res.ok) throw new Error('Cancel failed');
        alert('Your order has been cancelled.');
        localStorage.removeItem('orderDetails');
        window.location.href = 'index.html';
      })
      .catch(err => {
        console.error(err);
        alert('Order has not been cancelled. Please try again later. Or contact support.');
      });
    }
  }
</script>

</body>
</html>
