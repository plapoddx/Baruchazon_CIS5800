<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel - Baruchazon</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
  <link rel="stylesheet" href="project.css">
  <style>
    body {
      background-color: #f5f5f5;
      font-family: 'Poppins', sans-serif;
      padding-top: 70px;
    }

    .container {
      max-width: 1100px;
    }

    .admin-header {
      background: linear-gradient(rgba(11,26,51,0.8), rgba(11,26,51,0.8)), url('admin-hero.jpg') center/cover no-repeat;
      color: white;
      padding: 60px 30px;
      text-align: center;
      border-radius: 8px;
      margin-bottom: 30px;
      animation: fadeInDown 1s ease-out;
    }

    .search-bar, .sort-bar {
      margin-bottom: 20px;
    }

    .order-card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      padding: 20px;
      margin-bottom: 30px;
      transition: transform 0.2s;
    }

    .order-card:hover {
      transform: translateY(-5px);
    }

    .order-header {
      font-size: 20px;
      font-weight: 700;
      color: #0b1a33;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .order-info p {
      margin: 5px 0;
      font-size: 15px;
    }

    .order-info strong {
      color: #0b1a33;
    }

    .order-table th {
      background-color: #e9f1f7;
      color: #0b1a33;
    }

    .table-total {
      background-color: #d1ecf1;
      font-weight: bold;
      color: #0b1a33;
    }

    .btn-danger, .btn-primary {
      font-size: 14px;
      padding: 6px 12px;
      border-radius: 20px;
    }

    .status-select {
      border-radius: 20px;
      padding: 5px 10px;
      font-size: 14px;
      background: #e9f1f7;
      color: #0b1a33;
      border: none;
    }

    footer {
      background-color: #0b1a33;
      color: white;
      text-align: center;
      padding: 15px 0;
      margin-top: 40px;
      font-size: 14px;
    }

    #loading {
      text-align: center;
      margin-top: 50px;
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
  <div class="container">
    <div class="collapse navbar-collapse" id="adminNav">
      <ul class="navbar-nav ml-auto">
        <li class="nav-item"><a class="nav-link" href="admin-product.html">Products Management</a></li>
        <li class="nav-item"><a class="nav-link" href="admin.html">Order Dashboard</a></li>
      </ul>
    </div>
  </div>
</nav>
<body>

<div class="container">
  <div class="admin-header">
    <h1>Baruchazon Admin Dashboard</h1>
    <p>Manage your customer orders below!</p>
  </div>

  <div class="d-flex justify-content-between mb-4">
    <input id="search-bar" class="form-control w-50 search-bar" type="text" placeholder="🔎 Search by Customer Name..." oninput="filterOrders()">
    
    <select id="sort-bar" class="form-control w-25 sort-bar" onchange="sortOrders()">
      <option value="newest">Newest First</option>
      <option value="oldest">Oldest First</option>
      <option value="pending">Pending</option>
      <option value="shipped">Shipped</option>
      <option value="delivered">Delivered</option>
    </select>
  </div>

  <div id="loading">
    <div class="spinner-border text-primary" role="status">
      <span class="sr-only">Loading...</span>
    </div>
  </div>

  <div id="order-list"></div>
</div>

<footer>
  <p>&copy; 2025 Baruchazon Admin</p>
</footer>

<script>
let allOrders = [];

function deleteOrder(orderId) {
  if (confirm('Are you sure you want to delete this order?')) {
    fetch(`https://api-baruchazon-server.onrender.com/api/orders/${orderId}`, { method: 'DELETE' })
    .then(res => {
      if (!res.ok) throw new Error('Delete failed');
      alert('Order DELETED successfully');
      location.reload();
    })
    .catch(() => alert('Delete FAILED'));
  }
}

function updateStatus(orderId) {
  const newStatus = document.getElementById(`status-${orderId}`).value;
  fetch(`https://api-baruchazon-server.onrender.com/api/orders/${orderId}/status`, {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ status: newStatus })
  })
  .then(res => {
    if (!res.ok) throw new Error('Failed');
    alert('Status updated OK');
  })
  .catch(() => alert('FAILED updating status'));
}

function filterOrders() {
  const search = document.getElementById('search-bar').value.toLowerCase();
  const filtered = allOrders.filter(order => order.name.toLowerCase().includes(search));
  renderOrders(filtered);
}

function sortOrders() {
  const sortType = document.getElementById('sort-bar').value;
  let sorted = [...allOrders];

  if (sortType === 'newest') {
    sorted.sort((a, b) => b.order_id - a.order_id);
  } else if (sortType === 'oldest') {
    sorted.sort((a, b) => a.order_id - b.order_id);
  } else {
    sorted = sorted.filter(order => order.status.toLowerCase() === sortType);
  }

  renderOrders(sorted);
}

function renderOrders(data) {
  const container = document.getElementById('order-list');
  container.innerHTML = '';

  if (data.length === 0) {
    container.innerHTML = '<p class="text-center text-muted">NO orders found.</p>';
    return;
  }

  data.forEach(order => {
    const total = order.items.reduce((sum, item) => sum + (parseFloat(item.price) * item.quantity), 0);
    const rows = order.items.map(item => `
      <tr>
        <td>${item.product_name}</td>
        <td>${item.quantity}</td>
        <td>$${parseFloat(item.price).toLocaleString('en-US', {minimumFractionDigits: 2})}</td>
        <td>$${(parseFloat(item.price) * item.quantity).toFixed(2)}</td>
      </tr>`).join('');

    const card = document.createElement('div');
    card.className = 'order-card';
    card.innerHTML = `
      <div class="order-header">
        <div>Order #${order.order_id} - ${order.name}</div>
        <button class="btn btn-danger btn-sm" onclick="deleteOrder(${order.order_id})">Delete</button>
      </div>
      <div class="order-info">
        <p><strong>Email:</strong> ${order.email}</p>
        <p><strong>Phone:</strong> ${order.phone}</p>
        <p><strong>Shipping:</strong> ${order.address}</p>
        <p><strong>Delivery Date:</strong> ${order.delivery_date}</p>
        <p><strong>Status:</strong> 
          <select class="status-select" id="status-${order.order_id}" onchange="updateStatus(${order.order_id})">
            <option ${order.status === 'Pending' ? 'selected' : ''}>Pending</option>
            <option ${order.status === 'Shipped' ? 'selected' : ''}>Shipped</option>
            <option ${order.status === 'Delivered' ? 'selected' : ''}>Delivered</option>
            <option ${order.status === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
          </select>
        </p>
      </div>
      <table class="table table-bordered order-table">
        <thead>
          <tr>
            <th>Item</th>
            <th>Qty</th>
            <th>Price</th>
            <th>Subtotal</th>
          </tr>
        </thead>
        <tbody>
          ${rows}
          <tr class="table-total">
            <td colspan="3">Total</td>
            <td>$${total.toLocaleString('en-US', {minimumFractionDigits: 2})}</td>
          </tr>
        </tbody>
      </table>
    `;
    container.appendChild(card);
  });
}

// Initial Fetch
fetch('https://api-baruchazon-server.onrender.com/api/orders-with-items')
  .then(res => res.json())
  .then(data => {
    document.getElementById('loading').style.display = 'none';
    allOrders = data;
    renderOrders(data);
  })
  .catch(err => {
    console.error(err);
    document.getElementById('loading').innerHTML = '<p class="text-danger">Failed to load orders. Please Check Database Connection or Console.</p>';
  });

  if (order.status === 'Cancelled') {
  card.style.opacity = 0.6;
}

</script>

</body>
</html>
