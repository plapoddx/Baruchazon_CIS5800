<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Login - Baruchazon</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-card {
      background: white;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .login-card h2 {
      font-weight: 600;
      margin-bottom: 20px;
      color: #0b1a33;
    }

    .form-control {
      margin-bottom: 15px;
      border-radius: 8px;
    }

    .btn-login {
      background-color: #0b1a33;
      color: white;
      border-radius: 30px;
      font-weight: 600;
      padding: 10px 20px;
      transition: background-color 0.3s ease;
    }

    .btn-login:hover {
      background-color: #102f5c;
    }
  </style>
</head>

<body>
  <div class="login-card">
    <h2>Admin Login</h2>
    <form id="login-form">
      <input type="text" id="username" class="form-control" placeholder="Username" required>
      <input type="password" id="password" class="form-control" placeholder="Password" required>
      <button type="submit" class="btn btn-login btn-block">Login</button>
    </form>
  </div>

  <script>
    document.getElementById("login-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      const res = await fetch("https://api-baruchazon-server.onrender.com/api/admin-login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: document.getElementById("username").value,
          password: document.getElementById("password").value
        })
      });

      const data = await res.json();
if (data.success) {
  localStorage.setItem('admin-auth', 'true'); // Store token
  window.location.href = "admin.html";
} else {
  alert("FAILED: Invalid credentials. Try again.");
}
    });
  </script>
</body>
</html>
