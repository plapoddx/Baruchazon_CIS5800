<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>All Products - Baruchazon</title>
  <link rel="stylesheet" href="project.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
  <link rel="stylesheet" href="project.css">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f9f9f9;
    }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 30px;
      padding: 40px;
      margin-top: 20px;
    }
    .product-card {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
      transition: transform 0.3s, box-shadow 0.3s;
      text-align: center;
      padding: 20px;
    }
    .product-card:hover {
      transform: scale(1.03);
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .product-card img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      margin-bottom: 15px;
    }
    .product-name {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .product-price {
      font-size: 16px;
      color: #4dabf7;
    }
    .pagination-wrapper {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin: 40px 0;
    }
    footer {
      background-color: #081a35;
      color: white;
      text-align: center;
      padding: 20px 0;
      margin-top: 40px;
    }
  </style>
</head>
<body>

<div id="navbar"></div>

<main>
  <h1 class="text-center mt-4">All Electronics</h1>
  <p class="text-center mb-4">Explore our wide range of products</p>
  <div class="product-grid" id="product-grid"></div>
  <div id="pagination" class="pagination-wrapper"></div>
</main>

<footer>
  <p>&copy; 2025 Baruchazon. All rights reserved.</p>
</footer>

<script>
  fetch('navbar.html')
    .then(response => response.text())
    .then(data => {
      document.getElementById('navbar').innerHTML = data;
      updateCartCount();
    });

  function updateCartCount() {
    const cart = JSON.parse(localStorage.getItem('cart')) || [];
    const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
    const cartCountElement = document.getElementById('cart-count');
    if (cartCountElement) cartCountElement.textContent = totalItems;
  }

  document.addEventListener('DOMContentLoaded', () => {
    updateCartCount();
  });

  fetch('https://api-baruchazon-server.onrender.com/api/products')
    .then(response => response.json())
    .then(products => {
      const electronicsProducts = products.filter(product => 
          product.category.toLowerCase() === 'electronics');
          const grid = document.getElementById('product-grid');
          const paginationContainer = document.getElementById('pagination');

      const productsPerPage = 60;
      let currentPage = 1;
      const totalPages = Math.ceil(electronicsProducts.length / productsPerPage);

      function renderProducts(page) {
        grid.innerHTML = '';
        const start = (page - 1) * productsPerPage;
        const end = start + productsPerPage;
        const pageProducts = electronicsProducts.slice(start, end);

        pageProducts.forEach(product => {
          const card = document.createElement('div');
          card.className = 'product-card';
          card.innerHTML = `
            <img src="images/${product.image_url}" alt="${product.name}">
            <div class="product-name">${product.name}</div>
            <div class="product-rating">${'★'.repeat(Math.floor(product.rating))}${'☆'.repeat(5 - Math.floor(product.rating))}</div>
            <div class="product-price">$${Number(product.price).toLocaleString('en-US', { minimumFractionDigits: 2 })}</div>
            <div class="mt-3">
              <a href="product.html?id=${product.id}" class="btn btn-outline-primary btn-sm">View</a>
              <button class="btn btn-success btn-sm add-to-cart-btn" data-id="${product.id}">Quick Add</button>
            </div>
          `;
          grid.appendChild(card);
        });

        setupAddToCartButtons();
        renderPagination();
      }

      function renderPagination() {
        paginationContainer.innerHTML = '';

        const prevBtn = document.createElement('button');
        prevBtn.className = 'btn btn-secondary btn-sm';
        prevBtn.textContent = 'Previous';
        prevBtn.disabled = currentPage === 1;
        prevBtn.onclick = () => {
          currentPage--;
          renderProducts(currentPage);
        };
        paginationContainer.appendChild(prevBtn);

        for (let i = 1; i <= totalPages; i++) {
          const pageBtn = document.createElement('button');
          pageBtn.className = 'btn btn-sm';
          pageBtn.textContent = i;
          pageBtn.classList.add(i === currentPage ? 'btn-primary' : 'btn-outline-primary');
          pageBtn.onclick = () => {
            currentPage = i;
            renderProducts(currentPage);
          };
          paginationContainer.appendChild(pageBtn);
        }

        const nextBtn = document.createElement('button');
        nextBtn.className = 'btn btn-secondary btn-sm';
        nextBtn.textContent = 'Next';
        nextBtn.disabled = currentPage === totalPages;
        nextBtn.onclick = () => {
          currentPage++;
          renderProducts(currentPage);
        };
        paginationContainer.appendChild(nextBtn);
      }

      function setupAddToCartButtons() {
        document.querySelectorAll('.add-to-cart-btn').forEach(button => {
          button.addEventListener('click', () => {
            const id = +button.getAttribute('data-id');
            const product = products.find(p => p.id === id);
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            const existing = cart.find(i => i.id === id);
            if (existing) existing.quantity += 1;
            else cart.push({ id: product.id, name: product.name, price: +product.price, image_url: product.image_url, quantity: 1 });
            localStorage.setItem('cart', JSON.stringify(cart));
            alert(`SUCCESS -  ${product.name} added to cart!`);
            updateCartCount();
          });
        });
      }

      renderProducts(currentPage);
    })
    .catch(err => console.error('FAILED -  Failed to load products:', err));
</script>

</body>
</html>
